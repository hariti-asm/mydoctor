<div class="flex h-screen bg-gray-900 text-gray-100">
  <!-- Admin Sidebar -->
  <aside class="w-64 bg-black flex-shrink-0 flex flex-col border-r border-gray-800">
    <div class="p-8">
      <h2 class="text-2xl font-black text-white tracking-tighter italic">ADMIN<span class="text-red-600">.</span></h2>
      <p class="text-gray-500 text-[10px] uppercase tracking-[0.2em] mt-1 font-bold">Control Tower</p>
    </div>
    
    <nav class="flex-1 px-4 space-y-1 py-4">
      <a routerLink="./dashboard" routerLinkActive="bg-white/10 text-white" 
         class="flex items-center px-4 py-3 text-gray-400 hover:text-white hover:bg-white/5 rounded-lg transition-all group">
        <svg class="w-5 h-5 mr-3 opacity-50 group-hover:opacity-100" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 002 2h2a2 2 0 002-2"></path></svg>
        Overview
      </a>
      <a routerLink="/users" class="flex items-center px-4 py-3 text-gray-400 hover:text-white hover:bg-white/5 rounded-lg transition-all group">
        <svg class="w-5 h-5 mr-3 opacity-50 group-hover:opacity-100" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
        Users
      </a>
      <a routerLink="/logs" class="flex items-center px-4 py-3 text-gray-400 hover:text-white hover:bg-white/5 rounded-lg transition-all group">
        <svg class="w-5 h-5 mr-3 opacity-50 group-hover:opacity-100" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
        System Logs
      </a>
    </nav>
    
    <div class="p-6 border-t border-gray-800">
       <button (click)="logout()" class="w-full py-3 bg-red-950 text-red-500 rounded-xl font-bold hover:bg-red-900 transition-colors">
         Logout
       </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 overflow-y-auto bg-[#0a0a0a] p-12">
    <router-outlet></router-outlet>
  </main>
</div>
