<div class="video-container h-screen bg-black text-white flex flex-col pt-20">
  <div *ngIf="!userEmail" class="flex-1 flex items-center justify-center p-4">
      <div class="text-center">
          <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-500 mx-auto mb-4"></div>
          <p class="text-zinc-500 font-medium">Initializing Video Consultation...</p>
      </div>
  </div>
  <div *ngIf="mediaUnavailable" class="absolute top-24 left-1/2 -translate-x-1/2 z-50 bg-yellow-500/90 text-black px-6 py-3 rounded-xl text-sm font-bold shadow-xl max-w-md text-center">
      ⚠️ Camera/Microphone unavailable. This page must be served over <strong>HTTPS</strong> or <strong>localhost</strong> for video calls to work.
  </div>
  <div *ngIf="userEmail" class="flex-1 relative flex items-center justify-center p-4">
    <!-- Remote Video (Main) -->
    <div class="w-full h-full bg-zinc-900 rounded-3xl overflow-hidden shadow-2xl relative border border-zinc-800">
      <div class="absolute inset-0 flex items-center justify-center" *ngIf="!isRemoteJoined">
        <div class="text-center">
            <div class="animate-pulse bg-indigo-500/20 p-6 rounded-full mb-4 inline-block">
                <svg class="w-12 h-12 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
            </div>
            <p class="text-zinc-500 font-medium">Waiting for participant to join...</p>
        </div>
      </div>
      <video #remoteVideo autoplay playsinline class="w-full h-full object-cover"></video>
      
      <!-- Participant Tag -->
      <div class="absolute bottom-6 left-6 bg-black/40 backdrop-blur-md px-4 py-2 rounded-xl text-sm font-bold border border-white/10">
          {{ isDoctor ? 'Patient Preview' : 'Doctor Previews' }}
      </div>
    </div>

    <!-- Local Video (Picture-in-picture) -->
    <div class="absolute top-8 right-8 w-48 h-64 bg-zinc-800 rounded-2xl overflow-hidden shadow-2xl border-2 border-white/20">
      <video #localVideo autoplay playsinline muted class="w-full h-full object-cover mirror"></video>
      <div class="absolute bottom-3 left-3 bg-black/40 backdrop-blur-md px-2 py-1 rounded-lg text-[10px] font-bold">
          You
      </div>
    </div>
  </div>

  <!-- Call Controls -->
  <div class="h-28 bg-zinc-950/80 backdrop-blur-xl border-t border-white/5 flex items-center justify-center space-x-6 px-4">
    <button (click)="toggleAudio()" [class]="isMuted ? 'bg-red-500 text-white' : 'bg-zinc-800 text-gray-300 hover:bg-zinc-700'" class="p-4 rounded-full transition-all transform active:scale-95 shadow-xl">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path *ngIf="!isMuted" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path>
        <path *ngIf="isMuted" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" clip-rule="evenodd"></path>
      </svg>
    </button>
    
    <button (click)="endCall()" class="px-8 py-4 bg-red-600 text-white rounded-2xl font-black hover:bg-red-700 transition-all shadow-lg active:scale-95 flex items-center">
      <svg class="w-6 h-6 mr-2 rotate-[135deg]" fill="currentColor" viewBox="0 0 20 20"><path d="M2 3a1 1 0 011-1h2.153a1 1 0 01.986.836l.74 4.435a1 1 0 01-.54 1.06l-1.548.773a11.037 11.037 0 006.105 6.105l.774-1.548a1 1 0 011.059-.54l4.435.74a1 1 0 01.836.986V17a1 1 0 01-1 1h-2C10.077 18 2 9.923 2 2V3z"></path></svg>
      Leave Consultation
    </button>

    <button (click)="toggleVideo()" [class]="!isVideoOff ? 'bg-zinc-800 text-gray-300 hover:bg-zinc-700' : 'bg-red-500 text-white'" class="p-4 rounded-full transition-all transform active:scale-95 shadow-xl">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path *ngIf="!isVideoOff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
        <path *ngIf="isVideoOff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636l-3.536 3.536m0 5.656l3.536 3.536M9.172 9.172L5.636 5.636m3.536 9.192l-3.536 3.536M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
      </svg>
    </button>
  </div>
</div>

<style>
 .mirror { transform: scaleX(-1); }
</style>
