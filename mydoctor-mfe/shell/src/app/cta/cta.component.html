<section id="contact">
  <div class="py-24 bg-white">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
      <h2 class="text-4xl sm:text-5xl font-bold text-gray-900 mb-6">
        Ready to Experience Better Healthcare?
      </h2>
      <p class="text-xl text-gray-600 mb-10">
        Join thousands who have already transformed their healthcare journey
      </p>
      <div class="flex flex-col sm:flex-row gap-4 justify-center">
        <a class="inline-flex items-center justify-center px-10 py-4 bg-green-500 text-white text-lg font-bold rounded-full hover:bg-green-600 transition-all shadow-lg"
           href="#register">
          Get Started Free
          <svg class="w-5 h-5 ml-2" fill="currentColor" viewBox="0 0 20 20">
            <path clip-rule="evenodd"
                  d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z"
                  fill-rule="evenodd"/>
          </svg>
        </a>
        <div>
          <!-- Contact Us Button -->
          <a
            class="inline-flex items-center justify-center px-10 py-4 bg-white border-2 border-gray-300 text-gray-900 text-lg font-bold rounded-full hover:border-green-500 hover:text-green-600 transition-all cursor-pointer"
            (click)="openPopup()">
            Contact Us
          </a>

          <!-- Popup Modal -->
          <div
            *ngIf="isPopupOpen"
            class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50"
            (click)="closePopup()">

            <div
              class="bg-white rounded-2xl shadow-2xl max-w-md w-full mx-4 p-8 relative"
              (click)="$event.stopPropagation()">

              <!-- Close Button -->
              <button
                (click)="closePopup()"
                class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
              </button>

              <!-- Form Header -->
              <h2 class="text-2xl font-bold text-gray-900 mb-2">Get in Touch</h2>
              <p class="text-gray-600 mb-6">We'd love to hear from you. Send us a message!</p>

              <!-- Contact Form -->
              <form (ngSubmit)="onSubmit()" #contactForm="ngForm">

                <!-- Name Field -->
                <div class="mb-4">
                  <label class="block text-gray-700 font-semibold mb-2" for="name">
                    Name *
                  </label>
                  <input
                    type="text"
                    id="name"
                    name="name"
                    [(ngModel)]="formData.name"
                    required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent"
                    placeholder="Your name">
                </div>

                <!-- Email Field -->
                <div class="mb-4">
                  <label class="block text-gray-700 font-semibold mb-2" for="email">
                    Email *
                  </label>
                  <input
                    type="email"
                    id="email"
                    name="email"
                    [(ngModel)]="formData.email"
                    required
                    email
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent"
                    placeholder="your.email@example.com">
                </div>

                <!-- Message Field -->
                <div class="mb-6">
                  <label class="block text-gray-700 font-semibold mb-2" for="message">
                    Message *
                  </label>
                  <textarea
                    id="message"
                    name="message"
                    [(ngModel)]="formData.message"
                    required
                    rows="4"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent resize-none"
                    placeholder="Your message..."></textarea>
                </div>

                <!-- Submit Button -->
                <button
                  type="submit"
                  [disabled]="!contactForm.form.valid"
                  class="w-full bg-green-500 text-white font-bold py-3 px-6 rounded-lg hover:bg-green-600 transition-colors disabled:bg-gray-300 disabled:cursor-not-allowed">
                  Send Message
                </button>
              </form>

              <!-- Success Message -->
              <div
                *ngIf="showSuccessMessage"
                class="mt-4 p-4 bg-green-100 border border-green-400 text-green-700 rounded-lg">
                Thank you! Your message has been sent successfully.
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
