name: Build and Push to AWS ECR

on:
  push:
    branches: ["main"]

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}

jobs:
  build-and-push-backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          [
            "discovery-server",
            "api-gateway",
            "user-service",
            "doctor-service",
            "appointment-service",
            "patient-service",
            "medicalrecord-service",
          ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build with Maven
        run: |
          cd backend/${{ matrix.service }}
          mvn package -DskipTests

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, Tag, and Push Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPO_NAME: mydoctor-${{ matrix.service }}
        run: |
          # Create repository if it doesn't exist
          aws ecr describe-repositories --repository-name $REPO_NAME || \
          aws ecr create-repository --repository-name $REPO_NAME

          docker build -t $ECR_REGISTRY/$REPO_NAME:latest ./backend/${{ matrix.service }}
          docker push $ECR_REGISTRY/$REPO_NAME:latest

  build-and-push-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: "npm"
          cache-dependency-path: mydoctor-mfe/shell/package-lock.json

      - name: Build Angular App
        run: |
          cd mydoctor-mfe/shell
          npm install
          npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, Tag, and Push Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPO_NAME: mydoctor-shell
        run: |
          # Create repository if it doesn't exist
          aws ecr describe-repositories --repository-name $REPO_NAME || \
          aws ecr create-repository --repository-name $REPO_NAME

          docker build -t $ECR_REGISTRY/$REPO_NAME:latest ./mydoctor-mfe/shell
          docker push $ECR_REGISTRY/$REPO_NAME:latest
