<div class="flex h-screen bg-gray-100">
  <!-- Sidebar -->
  <aside class="w-64 bg-indigo-900 text-white flex-shrink-0 hidden md:flex flex-col">
    <div class="p-6">
      <h2 class="text-2xl font-bold tracking-wider">MyDoctor</h2>
      <p class="text-indigo-300 text-xs mt-1 uppercase font-semibold">Doctor Portal</p>
    </div>
    
    <nav class="flex-1 px-4 space-y-2 py-4">
      <a routerLink="./dashboard" routerLinkActive="bg-indigo-800 text-white" 
         class="flex items-center px-4 py-3 text-indigo-100 hover:bg-indigo-800 rounded-xl transition-colors">
        <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
        Dashboard
      </a>
      <a routerLink="/appointments/my-appointments" routerLinkActive="bg-indigo-800 text-white"
         class="flex items-center px-4 py-3 text-indigo-100 hover:bg-indigo-800 rounded-xl transition-colors">
        <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
        Appointments
      </a>
      <a routerLink="/profile" routerLinkActive="bg-indigo-800 text-white"
         class="flex items-center px-4 py-3 text-indigo-100 hover:bg-indigo-800 rounded-xl transition-colors">
        <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
        My Profile
      </a>
    </nav>
    
    <div class="p-4 border-t border-indigo-800">
      <button (click)="logout()" class="w-full flex items-center px-4 py-3 text-indigo-300 hover:text-white hover:bg-indigo-800 rounded-xl transition-colors">
        <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
        Logout
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <div class="flex-1 flex flex-col overflow-hidden">
    <!-- Minimal Top Bar -->
    <header class="bg-white shadow-sm h-16 flex items-center justify-between px-8">
        <div class="flex items-center md:hidden">
             <h2 class="text-xl font-bold text-indigo-900">MyDoctor</h2>
        </div>
        <div class="flex items-center space-x-4 ml-auto">
            <span class="text-sm font-medium text-gray-700">{{ (authService.userProfile$ | async)?.firstName }}</span>
            <div class="h-8 w-8 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-700 font-bold">
                {{ (authService.userProfile$ | async)?.firstName?.charAt(0) }}
            </div>
        </div>
    </header>

    <!-- Dynamic Content -->
    <main class="flex-1 overflow-y-auto bg-gray-50 p-8">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
