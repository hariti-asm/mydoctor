server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: proxy api calls if needed, but we use api gateway at 9000
    # location /api {
    #     proxy_pass http://api-gateway:9000;
    # }
}
