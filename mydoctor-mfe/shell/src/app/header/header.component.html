<nav class="fixed top-0 left-0 right-0 bg-white shadow-md z-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-20">

      <!-- Logo -->
      <div (click)="scrollTo('home')" class="flex items-center cursor-pointer">
        <svg class="w-8 h-8 text-green-500 mr-2" fill="currentColor" viewBox="0 0 20 20">
          <path clip-rule="evenodd"
                d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z"
                fill-rule="evenodd"/>
        </svg>
        <span class="text-2xl font-bold text-gray-900">MyDoctor</span>
      </div>

      <!-- Desktop Menu -->
      <div class="hidden md:flex items-center space-x-8">
        <a (click)="scrollTo('home')" class="nav-link cursor-pointer">Home</a>
        <a (click)="scrollTo('features')" class="nav-link cursor-pointer">Features</a>
        <a (click)="scrollTo('about')" class="nav-link cursor-pointer">About</a>
        <a routerLink="/doctors" class="nav-link cursor-pointer">Doctors</a>
        <a (click)="scrollTo('testimonials')" class="nav-link cursor-pointer">Testimonials</a>
        <a (click)="scrollTo('contact')" class="nav-link cursor-pointer">Contact</a>
      </div>

      <!-- CTA Buttons - Desktop -->
      <div class="hidden md:flex items-center space-x-4">
        <ng-container *ngIf="!isLoggedIn; else loggedInDesktop">
          <a class="nav-link cursor-pointer" routerLink="/login">Login</a>
          <a class="px-6 py-2.5 bg-green-500 text-white font-semibold rounded-full hover:bg-green-600 transition-colors cursor-pointer"
             routerLink="/register">
            Sign Up
          </a>
        </ng-container>

        <ng-template #loggedInDesktop>
          <div class="flex items-center space-x-6">
            <span class="text-gray-700 font-medium">Welcome, 
              <span class="text-green-600">{{ userName }}</span>
            </span>
            
            <!-- Role-specific Links -->
            <a *ngIf="userRole === 'PATIENT'" 
               routerLink="/portal/patient/dashboard" 
               class="flex items-center text-gray-600 hover:text-green-500 font-medium transition-colors">
               <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
               Dashboard
            </a>

            <a *ngIf="userRole === 'DOCTOR'" 
               routerLink="/portal/doctor/dashboard" 
               class="flex items-center text-gray-600 hover:text-green-500 font-medium transition-colors">
               <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
               Dashboard
            </a>

            <button
              (click)="onLogout()"
              class="px-5 py-2 bg-red-50 text-red-600 font-semibold rounded-full border border-red-100 hover:bg-red-500 hover:text-white transition-all">
              Logout
            </button>
          </div>
        </ng-template>
      </div>

      <!-- Mobile Menu Button -->
      <button
        (click)="toggleMobileMenu()"
        class="md:hidden text-gray-700 hover:text-green-500 focus:outline-none transition-colors">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path *ngIf="!isMobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4 6h16M4 12h16M4 18h16"/>
          <path *ngIf="isMobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <!-- Mobile Menu -->
    <div *ngIf="isMobileMenuOpen"
         class="md:hidden border-t border-gray-200 py-4 animate-slideDown">
      <div class="flex flex-col space-y-4">
        <a (click)="scrollTo('home')" class="nav-link cursor-pointer">Home</a>
        <a (click)="scrollTo('features')" class="nav-link cursor-pointer">Features</a>
        <a (click)="scrollTo('about')" class="nav-link cursor-pointer">About</a>
        <a (click)="scrollTo('doctors')" class="nav-link cursor-pointer">Doctors</a>
        <a (click)="scrollTo('testimonials')" class="nav-link cursor-pointer">Testimonials</a>
        <a (click)="scrollTo('contact')" class="nav-link cursor-pointer">Contact</a>

        <!-- Mobile Auth Buttons -->
        <div class="pt-4 border-t border-gray-200 space-y-3">
          <ng-container *ngIf="!isLoggedIn; else loggedInMobile">
            <a routerLink="/login" (click)="toggleMobileMenu()"
               class="block text-center nav-link cursor-pointer py-2">
              Login
            </a>
            <a routerLink="/register" (click)="toggleMobileMenu()"
               class="block text-center px-6 py-2.5 bg-green-500 text-white font-semibold rounded-full hover:bg-green-600">
              Sign Up
            </a>
          </ng-container>

          <ng-template #loggedInMobile>
            <div class="text-center py-4 space-y-4">
              <div class="text-gray-700 font-bold text-lg">
                Welcome, <span class="text-green-600">{{ userName }}</span>
              </div>
              
              <a *ngIf="userRole === 'PATIENT'" 
                 routerLink="/portal/patient/dashboard" 
                 (click)="toggleMobileMenu()"
                 class="block w-full py-3 bg-gray-50 text-gray-700 rounded-xl font-semibold border border-gray-100">
                 Dashboard
              </a>

              <a *ngIf="userRole === 'DOCTOR'" 
                 routerLink="/portal/doctor/dashboard" 
                 (click)="toggleMobileMenu()"
                 class="block w-full py-3 bg-gray-50 text-gray-700 rounded-xl font-semibold border border-gray-100">
                 Dashboard
              </a>

              <button
                (click)="onLogout(); toggleMobileMenu()"
                class="w-full px-6 py-3 bg-red-500 text-white font-bold rounded-xl shadow-lg shadow-red-200">
                Logout
              </button>
            </div>
          </ng-template>
        </div>
      </div>
    </div>
  </div>
</nav>
<div class="h-20"></div>
