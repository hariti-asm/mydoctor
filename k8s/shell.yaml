apiVersion: apps/v1
kind: Deployment
metadata:
  name: shell-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shell-frontend
  template:
    metadata:
      labels:
        app: shell-frontend
    spec:
      containers:
        - name: shell-frontend
          image: REPLACE_WITH_YOUR_ACCOUNT.dkr.ecr.eu-west-3.amazonaws.com/mydoctor-shell:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: shell-frontend
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: shell-frontend
