apiVersion: apps/v1
kind: Deployment
metadata:
  name: shell-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shell-frontend
  template:
    metadata:
      labels:
        app: shell-frontend
    spec:
      containers:
        - name: shell-frontend
          image: REPLACE_WITH_YOUR_ACCOUNT.dkr.ecr.eu-west-3.amazonaws.com/mydoctor-shell:latest
          ports:
            - containerPort: 80
          volumeMounts:
            - name: config-volume
              mountPath: /usr/share/nginx/html/assets/config.json
              subPath: config.json
      volumes:
        - name: config-volume
          configMap:
            name: frontend-config
---
apiVersion: v1
kind: Service
metadata:
  name: shell-frontend
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: shell-frontend
