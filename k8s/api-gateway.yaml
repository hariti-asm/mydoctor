apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: 408743494483.dkr.ecr.eu-west-3.amazonaws.com/mydoctor-api-gateway:latest
          ports:
            - containerPort: 9000
          env:
            - name: LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_CLOUD_GATEWAY
              value: "TRACE"
            - name: LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_HTTP_SERVER_REACTIVE
              value: "DEBUG"
            - name: LOGGING_LEVEL_WEB
              value: "DEBUG"
            - name: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
              valueFrom:
                configMapKeyRef:
                  name: mydoctor-config
                  key: EUREKA_URL
            - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: mydoctor-config
                  key: EUREKA_INSTANCE_PREFER_IP_ADDRESS
            - name: APP_FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: mydoctor-config
                  key: FRONTEND_URL
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 9000
  selector:
    app: api-gateway
