<div class="space-y-8">
  <header class="flex justify-between items-end">
    <div>
      <h1 class="text-4xl font-black text-white uppercase tracking-tighter">Medical <span class="text-gray-500">Staff</span></h1>
      <p class="text-gray-400 mt-2">Oversee healthcare professionals and credentials.</p>
    </div>
    <div class="px-4 py-2 bg-zinc-900 border border-zinc-800 rounded-lg text-sm font-bold text-gray-500">
      DOCTORS: {{ totalDoctors }}
    </div>
  </header>

  <div class="bg-zinc-900 rounded-3xl border border-zinc-800 overflow-hidden shadow-2xl">
    <table class="w-full text-left border-collapse">
      <thead>
        <tr class="border-b border-zinc-800 bg-zinc-950">
          <th class="p-6 text-xs uppercase tracking-widest text-zinc-500 font-black">Doctor</th>
          <th class="p-6 text-xs uppercase tracking-widest text-zinc-500 font-black">Specialization</th>
          <th class="p-6 text-xs uppercase tracking-widest text-zinc-500 font-black">Email</th>
          <th class="p-6 text-xs uppercase tracking-widest text-zinc-500 font-black text-right">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let doctor of doctors" class="border-b border-zinc-800/50 hover:bg-white/[0.02] transition-colors group">
          <td class="p-6">
            <div class="flex items-center">
               <div class="w-10 h-10 bg-red-950 rounded-full flex items-center justify-center mr-4 text-sm font-bold border border-red-900 text-red-500">
                 DR
               </div>
               <span class="font-bold text-white">{{ doctor.firstName }} {{ doctor.lastName }}</span>
            </div>
          </td>
          <td class="p-6">
            <span class="text-zinc-400 font-bold block">{{ doctor.specialization }}</span>
            <span class="text-[10px] text-zinc-600 uppercase">{{ doctor.education }}</span>
          </td>
          <td class="p-6 text-zinc-400 font-mono text-sm">{{ doctor.email }}</td>
          <td class="p-6 text-right space-x-4">
            <button (click)="verifyDoctor(doctor)" class="text-green-500 font-bold text-xs uppercase hover:underline">
              Verify
            </button>
            <button (click)="deleteDoctor(doctor.id)" class="text-zinc-600 hover:text-red-500 transition-colors font-bold text-xs uppercase">
              Remove
            </button>
          </td>
        </tr>
        <tr *ngIf="doctors.length === 0 && !loading">
          <td colspan="4" class="p-20 text-center text-zinc-600 font-bold italic">No doctors assigned to the fleet.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
