version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: mydoctor-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./docker-data/postgres:/var/lib/postgresql/data

  discovery-server:
    build: ./backend/discovery-server
    container_name: discovery-server
    ports:
      - "8761:8761"
    environment:
      - EUREKA_CLIENT_REGISTER_WITH_EUREKA=false
      - EUREKA_CLIENT_FETCH_REGISTRY=false

  api-gateway:
    build: ./backend/api-gateway
    container_name: api-gateway
    ports:
      - "9000:9000"
    depends_on:
      - discovery-server
    environment:
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - APP_FRONTEND_URL=${APP_FRONTEND_URL:-http://localhost:4200}

  user-service:
    build: ./backend/user-service
    container_name: user-service
    volumes:
      - ./backend/user-service/target/user-service-3.4.0.jar:/app/app.jar
    depends_on:
      - postgres
      - discovery-server
    environment:
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/mydoctor_user_service
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-postgres}
      - APP_FRONTEND_URL=${APP_FRONTEND_URL:-http://localhost:4200}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092


  doctor-service:
    build: ./backend/doctor-service
    container_name: doctor-service
    depends_on:
      - postgres
      - discovery-server
    environment:
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/mydoctor_doctor_service
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-postgres}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092


  appointment-service:
    build: ./backend/appointment-service
    container_name: appointment-service
    volumes:
      - ./backend/appointment-service/target/appointment-service-0.0.1-SNAPSHOT.jar:/app/app.jar
    depends_on:
      - postgres
      - discovery-server
    environment:
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/mydoctor_appointment_service
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-postgres}
      - SERVICES_USER_URL=http://user-service:8081/api/v1
      - APP_FRONTEND_URL=${APP_FRONTEND_URL:-http://localhost:4200}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092


  patient-service:
    build: ./backend/patient-service
    container_name: patient-service
    depends_on:
      - postgres
      - discovery-server
    environment:
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/mydoctor_patient_service
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-postgres}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092


  medicalrecord-service:
    build: ./backend/medicalrecord-service
    container_name: medicalrecord-service
    volumes:
      - ./backend/medicalrecord-service/target/medicalrecord-service-0.0.1-SNAPSHOT.jar:/app/app.jar
    depends_on:
      - postgres
      - discovery-server
    environment:
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/mydoctor_medicalrecord_service
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-postgres}
      - SERVICES_APPOINTMENT_URL=http://appointment-service:8082/api/v1/appointments
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY}
      - AWS_REGION=us-east-1
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092


  payment-service:
    build: ./backend/payment-service
    container_name: payment-service
    depends_on:
      - postgres
      - discovery-server
    environment:
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/mydoctor_payment_service
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-postgres}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_PUBLIC_KEY=${STRIPE_PUBLIC_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - APP_FRONTEND_URL=${APP_FRONTEND_URL:-http://localhost:4200}

  shell:
    build: ./mydoctor-mfe/shell
    container_name: mydoctor-shell
    ports:
      - "4200:80"
    depends_on:
      - api-gateway

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1



