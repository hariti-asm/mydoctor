server.port=8085
spring.application.name=medicalrecord-service
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.datasource.url=jdbc:postgresql://localhost:5432/mydoctor_medicalrecord_service
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# Increase file upload size limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# AWS Configuration
aws.access-key=${AWS_ACCESS_KEY}
aws.secret-key=${AWS_SECRET_KEY}
aws.region=${AWS_REGION:us-east-1}
aws.s3.bucket=${S3_BUCKET:mydoctor-recordings}
aws.s3.transcript-bucket=${S3_TRANSCRIPT_BUCKET:mydoctor-transcripts}
aws.sqs.queue-name=${SQS_QUEUE:transcription-queue}
