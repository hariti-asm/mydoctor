<section id="contact" class="relative overflow-hidden z-10 block">
  <div class="absolute inset-0 bg-gradient-to-br from-emerald-900 via-teal-900 to-slate-900 -z-10 block"></div>
  <!-- Abstract decorations -->
  <div class="absolute top-1/2 left-1/4 -translate-y-1/2 w-96 h-96 bg-emerald-500/20 rounded-full blur-[100px] pointer-events-none z-0 hidden lg:block"></div>
  
  <div class="py-24 relative p-4 w-full">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 text-center bg-white/5 backdrop-blur-md border border-white/10 rounded-[3rem] p-12 shadow-[0_8px_32px_rgba(0,0,0,0.3)]">
      <h2 class="text-4xl sm:text-5xl font-extrabold text-white mb-6 tracking-tight drop-shadow-sm">
        Ready to Transform Your Health?
      </h2>
      <p class="text-xl text-emerald-50 mb-10 font-light">
        Join thousands of satisfied patients who trust us with their medical care.
      </p>
      <div class="flex flex-col sm:flex-row gap-6 justify-center items-center">
        <a class="inline-flex items-center justify-center px-10 py-4 bg-emerald-500 text-white text-lg font-bold rounded-full hover:bg-emerald-400 hover:-translate-y-1 hover:shadow-[0_0_20px_rgba(16,185,129,0.5)] transition-all duration-300 shadow-lg"
           routerLink="/register">
          Get Started Today
          <svg class="w-5 h-5 ml-2 transition-transform group-hover:translate-x-1" fill="currentColor" viewBox="0 0 20 20">
            <path clip-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" fill-rule="evenodd"/>
          </svg>
        </a>
        <a class="inline-flex items-center justify-center px-10 py-4 bg-white/10 backdrop-blur-md border outline-none border-white/20 text-white text-lg font-bold rounded-full hover:bg-white/20 hover:border-white/40 transition-all duration-300 cursor-pointer"
           (click)="openPopup()">
          Contact Us
        </a>

        <!-- Popup Modal -->
        <div *ngIf="isPopupOpen" class="fixed inset-0 bg-slate-900/40 backdrop-blur-md flex items-center justify-center z-50 transition-opacity duration-300" (click)="closePopup()">
          <div class="bg-white rounded-3xl shadow-[0_20px_60px_rgba(0,0,0,0.3)] max-w-md w-full mx-4 p-8 relative transform scale-100 transition-transform duration-300 pointer-events-auto text-left" (click)="$event.stopPropagation()">
            <!-- Close Button -->
            <button (click)="closePopup()" class="absolute top-6 right-6 text-slate-400 hover:text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-full p-2 transition-all">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
              </svg>
            </button>

            <!-- Form Header -->
            <div class="mb-8">
              <h2 class="text-3xl font-extrabold text-slate-900 mb-2">Get in Touch</h2>
              <p class="text-slate-500 font-medium">We'd love to hear from you. Send us a message!</p>
            </div>

            <!-- Contact Form -->
            <form (ngSubmit)="onSubmit()" #contactForm="ngForm">
              <!-- Name Field -->
              <div class="mb-5">
                <label class="block text-slate-700 text-sm font-bold mb-2 ml-1" for="name">Name *</label>
                <input type="text" id="name" name="name" [(ngModel)]="formData.name" required class="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 transition-all text-slate-900 font-medium placeholder-slate-400" placeholder="Your name">
              </div>

              <!-- Email Field -->
              <div class="mb-5">
                <label class="block text-slate-700 text-sm font-bold mb-2 ml-1" for="email">Email *</label>
                <input type="email" id="email" name="email" [(ngModel)]="formData.email" required email class="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 transition-all text-slate-900 font-medium placeholder-slate-400" placeholder="your.email@example.com">
              </div>

              <!-- Message Field -->
              <div class="mb-8">
                <label class="block text-slate-700 text-sm font-bold mb-2 ml-1" for="message">Message *</label>
                <textarea id="message" name="message" [(ngModel)]="formData.message" required rows="4" class="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 transition-all resize-none text-slate-900 font-medium placeholder-slate-400" placeholder="Your message..."></textarea>
              </div>

              <!-- Submit Button -->
              <button type="submit" [disabled]="!contactForm.form.valid" class="w-full bg-emerald-500 text-white font-bold py-4 px-6 rounded-2xl hover:bg-emerald-600 hover:shadow-[0_8px_20px_rgba(16,185,129,0.3)] transition-all disabled:bg-slate-300 disabled:cursor-not-allowed disabled:shadow-none hover:-translate-y-0.5">
                Send Message
              </button>
            </form>

            <!-- Success Message -->
            <div *ngIf="showSuccessMessage" class="mt-6 p-4 bg-emerald-50 border border-emerald-200 text-emerald-700 font-medium rounded-xl flex items-center">
              <svg class="w-5 h-5 mr-2 text-emerald-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>
              Thank you! Your message has been sent.
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
